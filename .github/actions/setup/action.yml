name: setup
description: Tools for making Rule World videos on a GitHub runner (ffmpeg, Python, Node, Chrome is already installed)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji libsndfile1 >/dev/null
        mkdir -p ~/.fonts && cp assets/fonts/*.ttf ~/.fonts/ 2>/dev/null || true
        fc-cache -f >/dev/null
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: cloud/requirements.txt
    - shell: bash
      run: pip install -q -r cloud/requirements.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: render/package-lock.json
    - shell: bash
      run: cd render && npm ci --omit=dev --no-audit --no-fund
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: whisper-models-v1
