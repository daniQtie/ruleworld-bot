# Puts the Telegram bot (cloud/worker/) on Cloudflare and points Telegram at it. Runs by itself when the worker code changes.
# Needs secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GH_PAT, TG_WEBHOOK_SECRET.
# After this runs, Telegram sends every tap to the Worker: no laptop listener (getUpdates) can run at the same time.
name: Deploy Telegram bot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloud/worker/**"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker, set its secrets, set the Telegram webhook
        working-directory: cloud/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Cloudflare secrets not added yet; nothing to deploy"; exit 0; }
          W="npx --yes wrangler@4"
          kv_id() { $W kv namespace list 2>/dev/null | jq -r '[.[] | select(.title | endswith("ruleworld"))][0].id // empty'; }
          id=$(kv_id)
          if [ -z "$id" ]; then $W kv namespace create ruleworld >/dev/null; id=$(kv_id); fi
          [ -n "$id" ] || { echo "could not create the KV store"; exit 1; }
          sed -i "s/__KV_ID__/$id/; s#__REPO__#$GITHUB_REPOSITORY#" wrangler.toml
          $W deploy | tee deploy.txt
          printf %s "$BOT_TOKEN"      | $W secret put BOT_TOKEN
          printf %s "$OWNER_ID"       | $W secret put OWNER_ID
          printf %s "$GH_PAT"         | $W secret put GH_TOKEN
          printf %s "$WEBHOOK_SECRET" | $W secret put WEBHOOK_SECRET
          url=$(grep -o 'https://[^ ]*workers\.dev' deploy.txt | head -1)
          [ -n "$url" ] || { echo "no workers.dev address: open Cloudflare > Workers once to pick a subdomain, then run this again"; exit 1; }
          curl -fsS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            --data-urlencode "url=$url/tg" --data-urlencode "secret_token=$WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' | jq -c '{ok, description}'
          curl -fsS "$url/hello" -H "X-Setup: $WEBHOOK_SECRET" >/dev/null && echo "bot said hello in Telegram"
