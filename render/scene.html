const plastic = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, metalness: 0.0, ...extra });

// ---------- R6-style avatar ----------

  }

    const bun = new THREE.Mesh(new THREE.SphereGeometry(0.46, 28, 20), hm); bun.position.set(0, 1.0, -0.35); head.add(bun);
    const tie = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.07, 10, 24), plastic('#c0392b')); tie.position.set(0, 0.86, -0.3); tie.rotation.x = 1.2; head.add(tie);

}
const cane = (g, { arms }) => {

// ---------- world ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ map: studTex('#58b947', 150), roughness: 0.75 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const path = new THREE.Mesh(new THREE.BoxGeometry(7, 0.1, 90), new THREE.MeshStandardMaterial({ map: studTex('#e0c48c', [3.5, 45]), roughness: 0.8 }));

    for (let k = -1; k <= 1; k++) { const fl = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), plastic(['#ff6b8a', '#ffd23f', '#ff8c42'][k + 1])); fl.position.set(2.3 * s + k * 0.45, 2.25, 3.3); h.add(fl); }

function fence(x, z, len, ry = 0) {

function rock(x, z, s) { const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 1), plastic('#9aa0a6', { roughness: 0.7, flatShading: true })); r.scale.y = 0.6; add(r, x, s * 0.35, z); }

hut(-10.5, -13, 0.45); hut(12, -17, -0.4, '#c58a4a', '#e07a4f'); hut(-6, -33, 0.15, '#a46e3c', '#f0d070'); hut(14, -38, -0.2, '#b98a50', '#7fb3e0');
